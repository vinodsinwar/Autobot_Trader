services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      AUTOBOT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autobot}:${POSTGRES_PASSWORD:-autobot}@db:5432/${POSTGRES_DB:-autobot}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-data:/srv/autobot/data

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autobot}
      POSTGRES_DB: ${POSTGRES_DB:-autobot}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autobot}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  app-data:
  db-data:
