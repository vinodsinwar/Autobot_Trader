[project]
name = "autobot-trader"
version = "0.1.0"
description = "Automated algo trading system: Telegram + YouTube signal ingestion, Dhan & Delta Exchange India execution, dashboard and reporting."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "websockets>=12.0",
    "telethon>=1.36",
    "litellm>=1.40",
    "structlog>=24.1",
    "cryptography>=42.0",
    "PyJWT>=2.8",
    "yt-dlp>=2025.1.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
stt-local = ["faster-whisper>=1.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
